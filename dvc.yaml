stages:
  pretraining:
    cmd: uv run python src/glm/pretrain.py
    params:
    - pretrain_parameters
    - seed
    outs:
    - dvclive/pretraining
    - src/glm/saved_models/pretrained_sinogram_model.pt

  training:
    cmd: uv run python src/glm/train.py
    params:
    - pretrain_parameters
    - train_parameters
    - seed
    deps:
    - src/glm/saved_models/pretrained_sinogram_model.pt
    outs:
    - dvclive/training
    - src/glm/saved_models/model.pt

  evaluate:
    foreach: ${evaluate_parameters.downsampling_sweep}
    do:
      cmd: uv run python src/glm/evaluate.py --downsampling ${item}
      deps:
      - src/glm/evaluate.py
      - src/glm/saved_models/model.pt
      params:
      - data
      - pretrain_parameters
      - train_parameters
      - evaluate_parameters
      - seed
      outs:
      - dvclive/evaluate/${item}

  sinogram_denoising:
    cmd: uv run python src/glm/sinogram_denoising.py
    params:
    - sinogram_denoising_params.yaml:
      - data
      - seed
      - hyperparameters
      - model_parameters
    outs:
    - dvclive/sinogram_denoising
    - src/glm/saved_models/sinogram_denoising_model.pt

  evaluate_sinogram_denoising:
    foreach: ${evaluate_parameters.downsampling_sweep}
    do:
      cmd: uv run python src/glm/evaluate_sinogram_denoising.py --downsampling 
        ${item}
      deps:
      - src/glm/evaluate_sinogram_denoising.py
      - src/glm/saved_models/sinogram_denoising_model.pt
      params:
      - evaluate_parameters
      - sinogram_denoising_params.yaml:
        - data
        - seed
        - hyperparameters
        - model_parameters
      outs:
      - dvclive/evaluate_sinogram_denoising/${item}

params:
- params.yaml
- sinogram_denoising_params.yaml
- dvclive/pretraining/params.yaml
- dvclive/training/params.yaml
- dvclive/evaluate/1/params.yaml
- dvclive/evaluate/2/params.yaml
- dvclive/evaluate/4/params.yaml
- dvclive/evaluate/6/params.yaml
- dvclive/evaluate/8/params.yaml
- dvclive/evaluate/10/params.yaml
- dvclive/evaluate_sinogram_denoising/1/params.yaml
- dvclive/evaluate_sinogram_denoising/2/params.yaml
- dvclive/evaluate_sinogram_denoising/4/params.yaml
- dvclive/evaluate_sinogram_denoising/6/params.yaml
- dvclive/evaluate_sinogram_denoising/8/params.yaml
- dvclive/evaluate_sinogram_denoising/10/params.yaml
- dvclive/sinogram_denoising/params.yaml
artifacts:
  pretrained_sinogram_model:
    path: src/glm/saved_models/pretrained_sinogram_model.pt
    type: model
    desc: Pretrained model for sinogram processing
    labels:
    - sinogram
    - pretraining
    meta:
      hyperparameters:
        learning_rate: '5e-4'
        epochs: 1
        batch_size: 8
        num_workers: 2
        downsampling: 1
      active_model: sinogram_CNN
      models:
        GLM:
          kernel_size: 7
          kernel_dimension: 1
          padding: 3
          n_channels: 24
          normalize: true
          improved: true
          cached: false
          add_self_loops: true
          aggr: add
        sinogram_CNN:
          kernel_size: 7
          kernel_dimension: 2
          padding: 3
          n_channels: 16
  end_to_end_model:
    path: src/glm/saved_models/model.pt
    type: model
    desc: Learned reconstruction model with sinogram and image modalities 
      processing
    labels:
    - sinogram
    - image
    - end-to-end
    - learned reconstruction
    meta:
      demo:
        data:
          raw_path: src/glm/datasets/raw/2detect
          processed_path: src/glm/datasets/processed/2detect
      data:
        raw_path: /home/emilien/datasets/raw/2detect
        processed_path: /home/emilien/datasets/processed/2detect
      experiment:
        name: end-to-end reconstruction
        run_id: run_004
        description: CNN with 16 channels
      pretrain_parameters:
        hyperparameters:
          learning_rate: '5e-4'
          epochs: 1
          batch_size: 8
          num_workers: 2
          downsampling: 1
        active_model: sinogram_CNN
        models:
          GLM:
            kernel_size: 7
            kernel_dimension: 1
            padding: 3
            n_channels: 24
            normalize: true
            improved: true
            cached: false
            add_self_loops: true
            aggr: add
          sinogram_CNN:
            kernel_size: 7
            kernel_dimension: 2
            padding: 3
            n_channels: 16
      train_parameters:
        hyperparameters:
          learning_rate: '5e-5'
          epochs: 40
          batch_size: 8
          num_workers: 2
          downsampling: 1
        active_pseudo_inverse: filtered_backprojection
        pseudo_inverse:
          backprojection:
            n_voxels: 1024
            impl: pytorch
          filtered_backprojection:
            n_voxels: 1024
            impl: pytorch
            filter_name: Ram-Lak
        active_image_model: image_CNN
        image_models:
          image_CNN:
            n_channels: 32
            in_channels: 1
            out_channels: 1
            kernel_dimension: 2
            kernel_size: 7
            padding: 3
